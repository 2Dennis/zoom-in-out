# Optional Hyprland snippet if you prefer sourcing binds instead of the
# shell service. On Omarchy Quattro, prefer:
#   omarchy plugin add <repo> --enable
# which loads Service.qml and installs the same binds at runtime.
#
# Conflicts: stock Omarchy uses SUPER + minus/equal (keycodes 20/21) to
# resize the focused window. Sourcing this file after unbinding those
# keys replaces that with text zoom. Fine-grained resize remains on
# SUPER + ALT + minus/equal and SUPER + CTRL + minus/equal.
#
# Super+0 is workspace 10 on Omarchy, so reset is Super+Ctrl+0.

unbind = SUPER, code:20
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20
unbind = SUPER SHIFT, code:21

bindd = SUPER, code:21, Zoom in, exec, ~/.config/omarchy/plugins/dennislexis.zoom-in-out/bin/omarchy-zoom in
bindd = SUPER SHIFT, code:21, Zoom in, exec, ~/.config/omarchy/plugins/dennislexis.zoom-in-out/bin/omarchy-zoom in
bindd = SUPER, code:20, Zoom out, exec, ~/.config/omarchy/plugins/dennislexis.zoom-in-out/bin/omarchy-zoom out
bindd = SUPER SHIFT, code:20, Zoom out, exec, ~/.config/omarchy/plugins/dennislexis.zoom-in-out/bin/omarchy-zoom out
bindd = SUPER CTRL, code:19, Reset zoom, exec, ~/.config/omarchy/plugins/dennislexis.zoom-in-out/bin/omarchy-zoom reset
