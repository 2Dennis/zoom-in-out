# Optional Hyprland 0.54 (hyprlang) snippet. On Omarchy Quattro, the
# service loads hypr/bindings.lua instead (Lua). Prefer:
#   omarchy plugin add <repo> --enable

unbind = SUPER, code:20
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20
unbind = SUPER SHIFT, code:21

bindd = SUPER, code:21, Zoom in, exec, ~/.config/omarchy/plugins/2Dennis.zoom-in-out/bin/omarchy-zoom in
bindd = SUPER SHIFT, code:21, Zoom in, exec, ~/.config/omarchy/plugins/2Dennis.zoom-in-out/bin/omarchy-zoom in
bindd = SUPER, code:20, Zoom out, exec, ~/.config/omarchy/plugins/2Dennis.zoom-in-out/bin/omarchy-zoom out
bindd = SUPER SHIFT, code:20, Zoom out, exec, ~/.config/omarchy/plugins/2Dennis.zoom-in-out/bin/omarchy-zoom out
bindd = SUPER CTRL, code:19, Reset zoom, exec, ~/.config/omarchy/plugins/2Dennis.zoom-in-out/bin/omarchy-zoom reset
